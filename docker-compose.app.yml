services:
  frontend:
    build:
      context: ./Frontend
    container_name: frontend_app
    command: sh -c "npm run preview -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    container_name: backend_api
    network_mode: host
    env_file:
      - ./Backend/.env
    restart: unless-stopped
