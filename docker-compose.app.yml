services:
  frontend:
    build:
      context: ./Frontend
    container_name: frontend_app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
    container_name: backend_api
    ports:
      - "5000:5000"
    env_file:
      - ./Backend/.env
    restart: unless-stopped
