name: Pre-Prod Pipeline

on:
  push:
    branches:
      - pre/production

permissions:
  contents: read

concurrency:
  group: pre-prod-deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: ~/aws-ha-task-manager-devops

jobs:
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Run backend tests
        working-directory: Backend
        run: npm test -- tests

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: Frontend
        run: npm run lint

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t task-manager-backend:preprod ./Backend

      - name: Build frontend Docker image
        run: docker build -t task-manager-frontend:preprod ./Frontend

      - name: Smoke test backend image
        run: docker run --rm task-manager-backend:preprod npm test -- tests/auth.test.js tests/task.test.js

      - name: Smoke test frontend image
        run: docker run --rm task-manager-frontend:preprod npm run build

  deploy-server-1:
    name: Deploy Server 1
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST_1 }}" >> ~/.ssh/known_hosts

      - name: Deploy to server 1
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_1 }}" << EOF
            set -e
            cd "${DEPLOY_PATH}"
            git fetch origin pre/production
            git checkout pre/production
            git pull origin pre/production
            docker-compose down
            docker-compose up -d --build
          EOF

  deploy-server-2:
    name: Deploy Server 2
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST_2 }}" >> ~/.ssh/known_hosts

      - name: Deploy to server 2
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_2 }}" << EOF
            set -e
            cd "${DEPLOY_PATH}"
            git fetch origin pre/production
            git checkout pre/production
            git pull origin pre/production
            docker-compose down
            docker-compose up -d --build
          EOF
